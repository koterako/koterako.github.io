<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>原子の世界を探検しよう！</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Noto Sans JP",
            "Yu Gothic",
            sans-serif;

        background: linear-gradient(135deg, #eef8ff, #f8fbff);

        color: #333;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 760px;
    }

    /* 各画面 */

    .screen {
        display: none;

        background: white;

        border-radius: 24px;

        padding: 40px 35px;

        box-shadow:
            0 8px 30px rgba(0, 0, 0, 0.08);

        text-align: center;
    }

    .screen.active {
        display: block;
    }

    /* タイトル */

    h1 {
        font-size: 40px;

        line-height: 1.5;

        margin-bottom: 25px;
    }

    /* 見出し */

    h2 {
        font-size: 28px;

        line-height: 1.6;

        margin-bottom: 30px;
    }

    /* 通常文章 */

    p {
        font-size: 20px;

        line-height: 1.9;
    }

    /* 導入文章 */

    .intro-text {
        margin: 20px auto 30px;

        max-width: 650px;
    }

    /* 問題 */

    .progress {
        font-size: 17px;

        color: #777;

        margin-bottom: 15px;
    }

    .question {
        font-size: 25px;

        font-weight: bold;

        line-height: 1.7;

        text-align: left;

        margin-bottom: 25px;
    }

    /* 選択肢 */

    .choices {
        text-align: left;

        max-width: 650px;

        margin: auto;
    }

    .choice {
        display: block;

        border: 2px solid #ddd;

        border-radius: 14px;

        padding: 16px;

        margin: 12px 0;

        font-size: 20px;

        cursor: pointer;

        transition: 0.2s;
    }

    .choice:hover {
        background: #f4faff;

        border-color: #9ac7e5;
    }

    .choice input {
        width: 22px;

        height: 22px;

        margin-right: 12px;

        vertical-align: middle;
    }

    /* ID入力 */

    input[type="text"] {
        width: 100%;

        max-width: 400px;

        padding: 14px;

        font-size: 20px;

        border: 2px solid #ccc;

        border-radius: 12px;

        margin: 10px 0 20px;
    }

    /* ボタン */

    button {
        border: none;

        border-radius: 14px;

        padding: 16px 36px;

        font-size: 20px;

        font-weight: bold;

        cursor: pointer;

        background: #4da3df;

        color: white;

        margin-top: 20px;
    }

    button:hover {
        opacity: 0.9;
    }

    /* エラーメッセージ */

    .message {
        color: #d33;

        font-size: 17px;

        margin-top: 20px;

        min-height: 25px;
    }

    /* 完了画面 */

    .complete-title {
        font-size: 32px;

        font-weight: bold;

        margin-bottom: 30px;
    }

    .complete-text {
        font-size: 23px;

        line-height: 2;
    }

    /* スマホ・iPad向け */

    @media (max-width: 600px) {

        body {
            padding: 10px;
        }

        .screen {
            padding: 30px 20px;
        }

        h1 {
            font-size: 32px;
        }

        h2 {
            font-size: 23px;
        }

        p {
            font-size: 18px;
        }

        .question {
            font-size: 21px;
        }

        .choice {
            font-size: 17px;
        }
    }

</style>
</head>


<body>

<div class="container">


<!-- ========================= -->
<!-- ① タイトル画面 -->
<!-- ========================= -->

<section id="titleScreen" class="screen active">

    <h1>
        原子の世界を<br>
        探検しよう！
    </h1>

    <p>
        身のまわりの物質は、<br>
        いったい何からできているんだろう？
    </p>

    <button onclick="showScreen('introScreen')">
        はじめる
    </button>

</section>



<!-- ========================= -->
<!-- ② 導入画面 -->
<!-- ========================= -->

<section id="introScreen" class="screen">

    <h2>
        原子ってなんだろう？<br>
        私たちの身の回りにどうかかわっているのだろう？
    </h2>

    <div class="intro-text">

        <p>
            これから原子の世界を探検します！<br>
            まずは「こうかな？」と思う答えを選んでみましょう。
        </p>

    </div>

    <button onclick="showScreen('idScreen')">
        次へ
    </button>

</section>



<!-- ========================= -->
<!-- ③ 参加者ID -->
<!-- ========================= -->

<section id="idScreen" class="screen">

    <h2>
        参加者IDを入力してください
    </h2>

    <p>
        先生から伝えられた<br>
        参加者IDを入力してください。
    </p>

    <input
        type="text"
        id="participantId"
        placeholder="例：A001"
        autocomplete="off"
    >

    <br>

    <button onclick="startTest()">
        事前テストをはじめる
    </button>

    <div
        id="idMessage"
        class="message">
    </div>

</section>



<!-- ========================= -->
<!-- ④ 事前テスト -->
<!-- ========================= -->

<section id="testScreen" class="screen">

    <div
        id="progress"
        class="progress">
        問題 1 / 5
    </div>


    <div
        id="questionText"
        class="question">
    </div>


    <div
        id="choices"
        class="choices">
    </div>


    <button
        id="nextButton"
        onclick="nextQuestion()">

        次へ

    </button>


    <div
        id="testMessage"
        class="message">
    </div>

</section>



<!-- ========================= -->
<!-- ⑤ 回答完了 -->
<!-- ========================= -->

<section id="completeScreen" class="screen">

    <div class="complete-title">
        予想を記録しました！
    </div>


    <div class="complete-text">

        <p>
            正解はまだ発表しません。
        </p>

        <p>
            では実際に原子に触って<br>
            考えてみましょう！
        </p>

    </div>


    <button onclick="startMR()">
        MR体験をはじめる
    </button>


    <div
        id="mrMessage"
        class="message">
    </div>

</section>


</div>



<script>


/* ==========================================
   Google Apps Script
   ========================================== */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbx-O3tVCMVuMF4eNTrW7NjJgPqgQ7syOarSjkOeFVu9enumS7VRlbeY35qoGHYcHzBsYA/exec";



/* ==========================================
   問題
   ========================================== */

const questions = [

    {
        text:
        "原子とは、どんなものだろう？",

        choices: [

            "物質をつくっている、とても小さな粒",

            "物質そのものをさらに小さくしたもの",

            "物質が変化するときに生まれる、小さな粒",

            "目には見えないが、物質とは別に存在している粒"

        ]
    },


    {
        text:
        "私たちが普段使っている水や、空気中にある二酸化炭素などと、原子はどのようにかかわっているだろう？",

        choices: [

            "原子が組み合わさることで、さまざまな物質ができている",

            "原子そのものが、水や二酸化炭素などの物質に変化している",

            "原子は物質とは別に存在していて、物質をつくることには関係しない",

            "水や二酸化炭素のような物質には、原子は含まれていない"

        ]
    },


    {
        text:
        "水は、なにからできているだろうか？",

        choices: [

            "水素",

            "酸素",

            "炭素",

            "窒素"

        ]
    },


    {
        text:
        "二酸化炭素は、なにからできているだろうか？",

        choices: [

            "水素",

            "酸素",

            "炭素",

            "窒素"

        ]
    },


    {
        text:
        "アンモニアは、なにからできているだろうか？",

        choices: [

            "水素",

            "酸素",

            "炭素",

            "窒素"

        ]
    }

];



/* ==========================================
   現在の状態
   ========================================== */

let currentQuestion = 0;

let answers = [];

let participantId = "";



/* ==========================================
   画面切り替え
   ========================================== */

function showScreen(screenId) {

    const screens =
        document.querySelectorAll(".screen");


    screens.forEach(function(screen) {

        screen.classList.remove("active");

    });


    document
        .getElementById(screenId)
        .classList.add("active");

}



/* ==========================================
   事前テスト開始
   ========================================== */

function startTest() {

    const idInput =
        document.getElementById("participantId");

    const message =
        document.getElementById("idMessage");


    participantId =
        idInput.value.trim();


    if (participantId === "") {

        message.textContent =
            "参加者IDを入力してください。";

        return;

    }


    message.textContent = "";


    currentQuestion = 0;

    answers = [];


    showQuestion();


    showScreen("testScreen");

}



/* ==========================================
   問題表示
   ========================================== */

function showQuestion() {

    const question =
        questions[currentQuestion];


    /* 問題番号 */

    document
        .getElementById("progress")
        .textContent =
        "問題 " +
        (currentQuestion + 1) +
        " / " +
        questions.length;



    /* 問題文 */

    document
        .getElementById("questionText")
        .textContent =
        question.text;



    /* 選択肢 */

    const choicesArea =
        document.getElementById("choices");


    choicesArea.innerHTML = "";



    question.choices.forEach(
        function(choice) {

            const label =
                document.createElement("label");


            label.className = "choice";



            const checkbox =
                document.createElement("input");


            checkbox.type =
                "checkbox";


            checkbox.name =
                "currentChoice";


            checkbox.value =
                choice;



            label.appendChild(checkbox);


            label.appendChild(
                document.createTextNode(choice)
            );


            choicesArea.appendChild(label);

        }
    );



    /* 最後の問題だけボタンを変更 */

    const nextButton =
        document.getElementById("nextButton");


    if (
        currentQuestion ===
        questions.length - 1
    ) {

        nextButton.textContent =
            "予想を決定する";

    } else {

        nextButton.textContent =
            "次へ";

    }



    document
        .getElementById("testMessage")
        .textContent = "";

}



/* ==========================================
   次の問題へ
   ========================================== */

function nextQuestion() {

    const checked =
        document.querySelectorAll(
            'input[name="currentChoice"]:checked'
        );


    const message =
        document.getElementById("testMessage");



    /* 未回答チェック */

    if (checked.length === 0) {

        message.textContent =
            "答えを1つ以上選んでください。";

        return;

    }



    /* 選択された回答を保存 */

    const selectedAnswers =
        Array.from(checked)
        .map(function(input) {

            return input.value;

        })
        .join("、");


    answers[currentQuestion] =
        selectedAnswers;



    /* 次の問題 */

    if (
        currentQuestion <
        questions.length - 1
    ) {

        currentQuestion++;

        showQuestion();

    }

    else {

        submitAnswers();

    }

}



/* ==========================================
   Googleスプレッドシートへ送信
   ========================================== */

function submitAnswers() {

    const formData =
        new URLSearchParams();



    formData.append(
        "participantId",
        participantId
    );


    formData.append(
        "question1",
        answers[0] || ""
    );


    formData.append(
        "question2",
        answers[1] || ""
    );


    formData.append(
        "question3",
        answers[2] || ""
    );


    formData.append(
        "question4",
        answers[3] || ""
    );


    formData.append(
        "question5",
        answers[4] || ""
    );



    fetch(
        SCRIPT_URL,
        {

            method: "POST",

            mode: "no-cors",

            headers: {

                "Content-Type":
                    "application/x-www-form-urlencoded"

            },

            body:
                formData.toString()

        }
    )
    .then(function() {

        /*
         * 正解はここでも表示しない
         */

        showScreen("completeScreen");

    })
    .catch(function(error) {

        console.error(error);


        document
            .getElementById("testMessage")
            .textContent =
            "送信に失敗しました。もう一度お試しください。";

    });

}



/* ==========================================
   MR体験開始
   ========================================== */

function startMR() {

    document
        .getElementById("mrMessage")
        .textContent =
        "これからMR体験をはじめます。";

}

</script>

</body>
</html>
