<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原子の世界｜事前テスト</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
    background: #f5f7fb;
    color: #222;
  }
  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 48px;
  }
  h1 {
    text-align: center;
    font-size: 30px;
    margin: 10px 0 8px;
  }
  .subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 28px;
  }
  .card {
    background: white;
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 4px 18px rgba(0,0,0,.08);
  }
  .progress {
    color: #666;
    font-size: 14px;
    margin-bottom: 12px;
  }
  h2 {
    font-size: 22px;
    line-height: 1.5;
    margin: 8px 0 22px;
  }
  .id-area {
    margin-bottom: 24px;
  }
  label {
    font-weight: 700;
  }
  input[type="text"] {
    width: 100%;
    margin-top: 8px;
    padding: 13px 14px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
  }
  .choice {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 12px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 10px;
    cursor: pointer;
  }
  .choice:hover { background: #f7f9fc; }
  .choice input { width: 20px; height: 20px; }
  button {
    display: block;
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled {
    opacity: .6;
    cursor: default;
  }
  .message {
    text-align: center;
    line-height: 1.8;
  }
  .message h2 { margin-top: 0; }
  .hidden { display: none; }
</style>
</head>

<body>
<div class="container">
  <h1>原子の世界</h1>
  <p class="subtitle">事前テスト</p>

  <div class="card" id="quizCard">
    <div class="id-area">
      <label for="participantId">参加者ID</label>
      <input id="participantId" type="text" placeholder="例：A001">
    </div>

    <div class="progress" id="progress">問題 1 / 3</div>
    <h2 id="question"></h2>
    <div id="choices"></div>

    <button id="nextButton">次へ</button>
  </div>

  <div class="card message hidden" id="resultCard">
    <h2>予想を記録しました！</h2>
    <p>
      今はまだ正解を確認しません。<br>
      それでは、実際にキューブを組み合わせて確かめてみましょう。
    </p>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx-O3tVCMVuMF4eNTrW7NjJgPqgQ7syOarSjkOeFVu9enumS7VRlbeY35qoGHYcHzBsYA/exec";

const questions = [
  {
    text: "水（みず）は、なにからできているだろうか？",
    choices: ["すいそ", "さんそ", "たんそ", "ちっそ"]
  },
  {
    text: "二酸化炭素（にさんかたんそ）は、なにからできているだろうか？",
    choices: ["すいそ", "さんそ", "たんそ", "ちっそ"]
  },
  {
    text: "アンモニアは、なにからできているだろうか？",
    choices: ["すいそ", "さんそ", "たんそ", "ちっそ"]
  }
];

let currentQuestion = 0;
const answers = ["", "", ""];

const participantId = document.getElementById("participantId");
const progress = document.getElementById("progress");
const question = document.getElementById("question");
const choices = document.getElementById("choices");
const nextButton = document.getElementById("nextButton");
const quizCard = document.getElementById("quizCard");
const resultCard = document.getElementById("resultCard");

function showQuestion() {
  const q = questions[currentQuestion];

  progress.textContent = `問題 ${currentQuestion + 1} / ${questions.length}`;
  question.textContent = q.text;
  choices.innerHTML = "";

  q.choices.forEach(choice => {
    const label = document.createElement("label");
    label.className = "choice";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = choice;
    checkbox.name = "answer";

    label.appendChild(checkbox);
    label.appendChild(document.createTextNode(choice));
    choices.appendChild(label);
  });

  nextButton.textContent =
    currentQuestion === questions.length - 1
      ? "予想を決定する"
      : "次へ";
}

function getSelectedAnswers() {
  return [...document.querySelectorAll('input[name="answer"]:checked')]
    .map(input => input.value);
}

nextButton.addEventListener("click", async () => {
  if (!participantId.value.trim()) {
    alert("参加者IDを入力してください。");
    participantId.focus();
    return;
  }

  const selected = getSelectedAnswers();

  if (selected.length === 0) {
    alert("答えを1つ以上選んでください。");
    return;
  }

  answers[currentQuestion] = selected.join("、");

  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    showQuestion();
    return;
  }

  nextButton.disabled = true;
  nextButton.textContent = "送信中…";

  const formData = new URLSearchParams();
  formData.append("participantId", participantId.value.trim());
  formData.append("question1", answers[0]);
  formData.append("question2", answers[1]);
  formData.append("question3", answers[2]);

  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      body: formData
    });

    quizCard.classList.add("hidden");
    resultCard.classList.remove("hidden");
  } catch (error) {
    console.error(error);
    alert("回答の送信に失敗しました。通信環境を確認してください。");
    nextButton.disabled = false;
    nextButton.textContent = "予想を決定する";
  }
});

showQuestion();
</script>
</body>
</html>
